[tool.ruff]
target-version = "py313"
extend-include = ["agent-microvm/agent-microvm", "agent-proxy/agent-proxy", "sandbox-coding-agent"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
    "E501",
    "EM",
    "INP001",
    "PT",
    "S",
    "T201",
    "TRY003",
    "UP022",
]

[tool.ty.src]
include = ["agent-microvm", "agent-microvm/agent-microvm", "agent-proxy/agent-proxy", "sandbox-coding-agent"]
