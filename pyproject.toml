[tool.ruff]
target-version = "py313"
extend-include = ["agent-microvm/agent-microvm", "agent-proxy/agent-proxy", "sandbox-coding-agent"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C401",     # unnecessary-generator-set
    "COM812",   # missing-trailing-comma
    "CPY",      # flake8-copyright
    "D203",     # incorrect-blank-line-before-class
    "D213",     # multi-line-summary-second-line
    "E501",     # line-too-long
    "EM",       # flake8-errmsg
    "INP001",   # implicit-namespace-package
    "PLW1510",  # subprocess-run-without-check
    "PT",       # flake8-pytest-style
    "S",        # flake8-bandit
    "T201",     # print
    "TRY003",   # raise-vanilla-args
    "UP022",    # replace-stdout-stderr
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["agent-microvm", "agent-microvm/agent-microvm", "agent-proxy/agent-proxy", "sandbox-coding-agent", "tests"]
